[versions]
agp = "8.7.3"
kotlin = "2.0.21"
appcompat = "1.7.0"
browser = "1.8.0"
coreKtx = "1.13.1"
coreSplashscreen = "1.0.1"
swipeRefresh = "1.1.0"
webkit = "1.12.1"
junit = "4.13.2"
orgJson = "20240303"
firebaseMessaging = "24.1.0"

[libraries]
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
swiperefresh = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swipeRefresh" }
webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebaseMessaging" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
