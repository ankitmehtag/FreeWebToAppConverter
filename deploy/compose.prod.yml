# One server runs everything except the worker, which runs on the same host because it needs Docker.
# Only Caddy is reachable from outside. Mongo and Redis listen on the host's loopback for the worker.
name: sitetoapk-prod

services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS, such as freewebsitetoappconverter.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../client/dist:/srv/site:ro
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [web]

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file: ${ENV_FILE:-../.env.production}
    environment:
      MONGO_URL: mongodb://mongo:27017/sitetoapk
      REDIS_URL: redis://redis:6379
      # Caddy is the only proxy, on this fixed network.
      TRUST_PROXY: 172.30.0.0/24
      SHOT_URL: http://shot:4000
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [web, shot]

  # Draws a picture of a site that won't be framed, for the phone preview. It runs a browser on strangers'
  # pages, so it has no secrets, no database and no network but its own, and the API is the only one to reach it.
  shot:
    build:
      context: ..
      dockerfile: server/Dockerfile.shot
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1500m
    cpus: 2
    pids_limit: 256
    restart: unless-stopped
    networks: [shot]

  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [web]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [web]

networks:
  web:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # Only the API and the screenshot service. It can reach the internet, but not Mongo, Redis or Caddy.
  shot:

volumes:
  caddy-data:
  mongo-data:
  redis-data:
